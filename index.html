<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <meta name="description" content="Generate strong, random passwords in your browser. Nothing is stored or sent anywhere.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Password generator</h1>
      <p class="sub">Created in your browser. Nothing is saved or sent anywhere.</p>
    </header>

    <section class="output" aria-label="Generated password">
      <output id="password" class="password" aria-live="polite">Select at least one option</output>
      <div class="actions">
        <button id="regen" class="icon-btn" type="button" aria-label="Generate new password" title="Generate new">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button id="copy" class="primary" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span id="copy-label">Copy password</span>
        </button>
      </div>
    </section>

    <section class="strength" aria-label="Password strength">
      <div class="meter" aria-hidden="true"><span id="bar"></span></div>
      <p id="strength-text">Strength: <strong>-</strong></p>
    </section>

    <section class="controls">
      <div class="length-row">
        <label for="length">Length</label>
        <input id="length-num" type="number" min="4" max="64" value="16" aria-label="Password length">
      </div>
      <input id="length" type="range" min="4" max="64" value="16">

      <fieldset>
        <legend>Include</legend>
        <label class="check"><input type="checkbox" id="upper" checked><span>Uppercase letters <small>A-Z</small></span></label>
        <label class="check"><input type="checkbox" id="lower" checked><span>Lowercase letters <small>a-z</small></span></label>
        <label class="check"><input type="checkbox" id="numbers" checked><span>Numbers <small>0-9</small></span></label>
        <label class="check"><input type="checkbox" id="symbols" checked><span>Symbols <small>!@#$%^&amp;*</small></span></label>
        <label class="check"><input type="checkbox" id="ambiguous"><span>Avoid look-alike characters <small>O 0 l 1 I</small></span></label>
      </fieldset>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
